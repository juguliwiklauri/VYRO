
name: TURBO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Set TURBO name and launcher logo
        run: |
          sed -i 's/android:label="[^"]*"/android:label="TURBO"/' android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/ic_turbo_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#080808"
                  android:pathData="M16,10 H92 V98 H16 Z"/>

              <path
                  android:fillColor="#FF2020"
                  android:pathData="M16,10 H92 V17 H16 Z"/>

              <path
                  android:fillColor="#EAEAEA"
                  android:pathData="M25,28 H83 V43 H61 V85 H47 V43 H25 Z"/>

              <path
                  android:fillColor="#FF2020"
                  android:pathData="M65,57 L86,69 L65,81 Z"/>

          </vector>
          EOF

          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/ic_turbo_launcher"#' android/app/src/main/AndroidManifest.xml

      - name: Disable incompatible Android lint task
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TURBO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
