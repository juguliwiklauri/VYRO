
name: VYRO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Disable incompatible Android lint task
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
