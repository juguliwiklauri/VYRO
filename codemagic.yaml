
workflows:
  vyro-android:
    name: VYRO Android APK
    max_build_duration: 60
    instance_type: mac_mini

    environment:
      flutter: stable

    scripts:
      - name: Prepare VYRO project
        script: |
          set -e

          python3 - <<'PY'
          import zipfile
          import pathlib
          import shutil
          import sys

          root = pathlib.Path.cwd()

          archives = sorted(
              [p for p in root.iterdir()
               if p.is_file() and p.suffix.lower() == ".zip"],
              key=lambda p: (
                  0 if "vyro_upload" in p.name.lower() else 1,
                  p.name
              )
          )

          selected = None

          for archive in archives:
              try:
                  with zipfile.ZipFile(archive) as z:
                      files = [
                          n for n in z.namelist()
                          if pathlib.PurePosixPath(n).name == "pubspec.yaml"
                      ]
                      if files:
                          selected = (archive, files[0])
                          break
              except zipfile.BadZipFile:
                  continue

          if selected is None:
              print("ERROR: Flutter project ZIP not found")
              sys.exit(1)

          archive, pubspec = selected
          prefix = str(pathlib.PurePosixPath(pubspec).parent)

          if prefix == ".":
              prefix = ""

          dest = root / "vyro_project"

          if dest.exists():
              shutil.rmtree(dest)

          dest.mkdir()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)

                  if path.is_absolute() or ".." in path.parts:
                      continue

                  if prefix and not str(path).startswith(prefix + "/"):
                      continue

                  rel = (
                      path.relative_to(pathlib.PurePosixPath(prefix))
                      if prefix else path
                  )

                  if not rel.parts:
                      continue

                  target = dest.joinpath(*rel.parts)

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as out:
                          shutil.copyfileobj(src, out)

          print("VYRO project extracted:", archive.name)
          PY

      - name: Configure Android and Firebase
        script: |
          set -e
          cd vyro_project

          flutter create --platforms=android .

          if [ ! -f ../google-services.json ]; then
            echo "ERROR: google-services.json not found in repository root"
            exit 1
          fi

          mkdir -p android/app
          cp ../google-services.json android/app/google-services.json

          echo "Firebase configuration file copied."

      - name: Install dependencies
        script: |
          set -e
          cd vyro_project
          flutter pub get

      - name: Build VYRO APK
        script: |
          set -e
          cd vyro_project
          flutter build apk --release

    artifacts:
      - vyro_project/build/app/outputs/flutter-apk/app-release.apk
